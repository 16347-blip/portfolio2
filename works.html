<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ผลงาน</title>

<style>
body{
    background:linear-gradient(#b8ecff,#e8fbff);
    font-family:tahoma;
    text-align:center;
    margin:0;
}

h1{
    color:#0099cc;
    margin-top:30px;
}

.card{
    background:white;
    width:60%;
    margin:20px auto;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 15px #8ddfff;
}

img{
    width:300px;
    border-radius:15px;
    margin:10px;
    box-shadow:0 3px 10px #bbb;
}

a{
    display:inline-block;
    background:#00bfff;
    color:white;
    padding:12px 25px;
    border-radius:20px;
    text-decoration:none;
    margin:30px;
}

/* สัตว์ทะเล */
.sea{
    position:fixed;
    font-size:45px;
    opacity:0.8;
}

.s1{top:20px;left:20px;}
.s2{top:80px;right:20px;}
.s3{top:220px;left:40px;}
.s4{top:320px;right:40px;}
.s5{bottom:180px;left:20px;}
.s6{bottom:80px;right:20px;}
.s7{bottom:20px;left:45%;}
.s8{top:450px;left:80%;}
.s9{top:500px;left:15%;}
.s10{top:150px;left:45%;}
</style>

</head>

<body>

<div class="sea s1">🐠</div>
<div class="sea s2">🐬</div>
<div class="sea s3">🐙</div>
<div class="sea s4">🦀</div>
<div class="sea s5">🐳</div>
<div class="sea s6">🐚</div>
<div class="sea s7">🪸</div>

</div>

<div class="card">
